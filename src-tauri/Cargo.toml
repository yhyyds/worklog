[package]
name = "worklog"
version = "0.1.0"
description = "Local-first work journal, planner and focus timer"
authors = ["Worklog contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "worklog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
tauri-plugin-notification = "2"
rusqlite = { version = "0.38", features = ["bundled"] }
