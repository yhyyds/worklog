name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Verify release version
        run: npm run check:version -- "${{ github.ref_name }}"

      - name: Run frontend checks
        run: npm run check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build both Windows installers
        run: npm run bundle:windows

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem "artifacts/*.exe" |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } |
            Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @"
          Windows x64 提供两种当前用户安装包：

          - no-webview2：不内置 WebView2 运行时；系统缺少运行时时，安装过程需要联网下载。
          - with-webview2：内置 WebView2 离线安装程序，可在无网络环境安装，体积较大。
          - 两种安装包的业务功能和本地数据格式完全相同。
          - 请使用 SHA256SUMS.txt 校验下载文件。

          当前安装包尚未配置商业代码签名，Windows SmartScreen 可能显示未知发布者提示。
          "@
          $notes | Set-Content -Encoding utf8 RELEASE_BODY.md
          $assets = @(Get-ChildItem "artifacts/*.exe" | Sort-Object Name | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path "SHA256SUMS.txt").Path
          gh release create "${{ github.ref_name }}" @assets --verify-tag --title "Worklog ${{ github.ref_name }}" --notes-file RELEASE_BODY.md
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed" }
