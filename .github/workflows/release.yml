name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: npm run check:version -- "${{ github.ref_name }}"

      - name: Run frontend checks
        run: npm run check

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build both Windows installers
        run: npm run bundle:windows

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @'
          Windows x64 当前用户安装包，无需管理员权限。

          - `no-webview2`：体积较小，不安装 WebView2；目标电脑必须已经具备 WebView2 Runtime。
          - `with-webview2`：内置 WebView2 离线安装程序，体积较大，可在无网络环境安装。
          - `no-webview2.msi`：供公司 IT、软件中心或 MSI 白名单部署的备用包，目标电脑需已有 WebView2 Runtime。
          - `BUILD-INFO.txt`：记录提交、文件大小、SHA-256 与 Authenticode 状态。
          - 所有业务数据保存在本地。
          - 请使用 `SHA256SUMS.txt` 校验下载文件。

          当前安装包尚未配置受信任代码签名，Windows SmartScreen 或组织策略仍可能阻止运行。MSI 便于 IT 审核部署，但不是安全策略绕过手段。
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP "worklog-release-notes.md"
          $notes | Set-Content -LiteralPath $notesPath -Encoding utf8
          $assets = @(Get-ChildItem -LiteralPath "artifacts/windows" -File | Select-Object -ExpandProperty FullName)
          if ($assets.Count -ne 5) { throw "Expected two NSIS installers, one MSI, checksum and build info" }
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --title "Worklog $env:GITHUB_REF_NAME" --notes-file $notesPath
