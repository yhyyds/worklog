name: Windows Release

on:
  push:
    branches:
      - 'baseline/1.4.0'
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.4.0' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release tag from the stable baseline
        if: github.ref_type == 'branch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $env:RELEASE_TAG $env:GITHUB_SHA
          git push origin "refs/tags/$env:RELEASE_TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: npm run check:version -- "$env:RELEASE_TAG"

      - name: Run frontend checks
        run: npm run check

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: npm run bundle:windows

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @'
          Windows x64 当前用户安装包，无需管理员权限。

          - 仅提供 `no-webview2` NSIS 安装包；目标电脑必须已经具备 Microsoft Edge WebView2 Runtime。
          - `BUILD-INFO.txt`：记录提交、文件大小、SHA-256 与 Authenticode 状态。
          - 所有业务数据保存在本地。
          - 请使用 `SHA256SUMS.txt` 校验下载文件。

          当前安装包尚未配置受信任代码签名，Windows SmartScreen 或组织策略仍可能阻止运行；请交由 IT 审核，不要绕过公司安全策略。
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP "worklog-release-notes.md"
          $notes | Set-Content -LiteralPath $notesPath -Encoding utf8
          $assets = @(Get-ChildItem -LiteralPath "artifacts/windows" -File | Select-Object -ExpandProperty FullName)
          if ($assets.Count -ne 3) { throw "Expected one NSIS installer, checksum and build info" }
          gh release view $env:RELEASE_TAG *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release edit $env:RELEASE_TAG --title "Worklog $env:RELEASE_TAG" --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw "Failed to update existing GitHub Release" }
            gh release upload $env:RELEASE_TAG $assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload GitHub Release assets" }
          } else {
            gh release create $env:RELEASE_TAG $assets --verify-tag --title "Worklog $env:RELEASE_TAG" --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release" }
          }
